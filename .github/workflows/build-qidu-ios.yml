name: Build Qidu iOS and Android
on:
  push:
    branches: ['codex/qidu-ios*']
    paths: ['qidu-reader/**', '.github/workflows/build-qidu-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: qidu-reader
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: qidu-reader/package-lock.json
      - name: Validate reader source
        run: npm ci && npm test
      - name: Build unsigned arm64 IPA
        env:
          EXPO_NO_TELEMETRY: '1'
          QIDU_SKIP_NPM_CI: '1'
        run: bash scripts/build-ios-unsigned.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Qidu-v0.9.0-unsigned-IPA
          path: qidu-reader/artifacts/Qidu-unsigned.ipa
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: qidu-reader
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: qidu-reader/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate reader source
        run: npm ci && npm test
      - name: Build Android device APK
        env:
          EXPO_NO_TELEMETRY: '1'
        run: |
          npx --no-install expo prebuild --platform android --no-install
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease -x lint -x test --no-daemon --max-workers 2 -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v7
        with:
          name: Qidu-v0.9.0-Android-APK
          path: qidu-reader/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
