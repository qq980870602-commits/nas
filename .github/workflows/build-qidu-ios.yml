name: Build Qidu reader unsigned IPA
on:
  push:
    branches: ['codex/qidu-ios*']
    paths: ['qidu-reader/**', '.github/workflows/build-qidu-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: qidu-reader
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: qidu-reader/package-lock.json
      - name: Validate reader source
        run: npm ci && npm test
      - name: Build unsigned arm64 IPA
        env:
          EXPO_NO_TELEMETRY: '1'
          QIDU_SKIP_NPM_CI: '1'
        run: bash scripts/build-ios-unsigned.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Qidu-v0.6.0-unsigned-IPA
          path: qidu-reader/artifacts/Qidu-unsigned.ipa
          if-no-files-found: error
