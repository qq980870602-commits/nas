name: Build Zhongyue Android compatibility
on:
  push:
    branches: ['codex/zhongyue-android*']
    paths: ['qidu-reader/**', '.github/workflows/zhongyue-android-compat.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: qidu-reader
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: qidu-reader/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate reader source
        run: npm ci && npm test
      - name: Build Android device APK
        env:
          EXPO_NO_TELEMETRY: '1'
        run: |
          npx --no-install expo prebuild --platform android --no-install
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease -x lint -x test --no-daemon --max-workers 2 -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v7
        with:
          name: Zhongyue-v0.10.1-Android-APK
          path: qidu-reader/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
